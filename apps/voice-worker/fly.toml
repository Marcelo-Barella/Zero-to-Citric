# Fly.io configuration for the Tangerina voice worker.
# Rename `app` and re-run `flyctl launch` if you want a different name.

app = "tangerina-voice"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/worker/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"
